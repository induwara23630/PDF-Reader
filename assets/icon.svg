<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bf5"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#sheen)"/>

  <!-- big serif "B" monogram -->
  <text x="435" y="700" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="620" fill="#ffffff" text-anchor="middle">B</text>

  <!-- small PDF file-type tag, bottom-right -->
  <g>
    <rect x="620" y="700" width="290" height="150" rx="26" fill="#ffffff"/>
    <text x="765" y="803" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800"
          font-size="92" fill="#dc2626" text-anchor="middle" letter-spacing="2">PDF</text>
  </g>
</svg>
